# ============================================
# Cesiumstart Runtime Configuration
# ============================================
# Edit this file to change settings without rebuilding
# Place this file next to Cesiumstart.exe
#
# Lines starting with # are comments
# Format: Key=Value (no spaces around =)
# ============================================

# === UDP Settings ===
# IP address to listen on (0.0.0.0 = all network interfaces)
ListenIP=0.0.0.0

# Port to receive Unity transform data
ListenPort=9999

# === Cesium Tileset URLs ===
# Leave empty to use the values set in Unreal Editor
# If you specify a URL here, it will override the editor value

# Buildings tileset (e.g., OSM Buildings)
BuildingsTilesetURL=http://192.168.0.146:8083/tileset.json

# Vegetation/Foliage tileset
VegetationTilesetURL=http://192.168.0.146:8084/tileset.json

# Terrain tileset (leave empty if using Cesium World Terrain)
TerrainTilesetURL=

# Custom tilesets (leave empty if not used)
CustomTileset1URL=
CustomTileset2URL=

# === Target Settings ===
# Name pattern to search for target aircraft actor
TargetActorNamePattern=F16

# === Debug Settings ===
# Set to true for verbose logging
EnableDebugLog=false
